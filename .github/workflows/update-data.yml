name: Update economic data

on:
  schedule:
    # Every 6 hours - keeps FRED indicators fresh and regenerates the
    # AI Tetlock forecast without needing a live backend server.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Fetch live FRED data
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npm run fetch-data

      - name: Generate Tetlock AI forecast
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: npm run generate-forecast

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data
          git diff --cached --quiet || git commit -m "chore: automated data refresh [skip ci]"
          git push
